{% extends 'base.html' %}
{% block title %}Edit User – BuyMe{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <h2 class="fw-bold mb-4">Edit User: {{ user.username }}</h2>
    <form action="{{ url_for('rep.rep_edit_user', user_id=user.user_id) }}" method="post">
      <div class="mb-3">
        <label class="form-label">Username</label>
        <input type="text" name="username" class="form-control" value="{{ user.username }}" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" name="email" class="form-control" value="{{ user.email }}" required>
      </div>
      <div class="mb-3">
        <label class="form-label">New password <span class="text-muted fw-normal">(leave blank to keep current)</span></label>
        <input type="password" name="new_password" class="form-control">
      </div>
      <button type="submit" class="btn btn-primary">Save Changes</button>
      <a href="{{ url_for('rep.rep_dashboard') }}" class="btn btn-outline-secondary ms-2">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
